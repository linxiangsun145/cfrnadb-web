document.querySelector('#content').innerHTML='<div class="page-top"><div><p class="eyebrow">GSE133684 · OPEN RESOURCE EXAMPLES</p><h1>'+c('Explore and reproduce cfRNA feature examples','查看并复现 cfRNA 特征案例')+'</h1><p>'+c('Exact source values, study context, code and vector figures.','提供精确来源值、研究语境、代码和矢量图。')+'</p></div></div><div class="note">'+c('This standalone case library is publicly available without login. Activation and final external validation of the interactive database portal are pending.','此独立案例库无需登录即可访问。交互式数据库门户仍待启用公网入口和完成外部验收。')+'</div><div class="metric-row">'+[['401',c('Source labels','来源标签')],['3',c('Reproducible cases','可复现案例')],['284 / 117',c('PDAC / healthy labels','PDAC / healthy 标签')],['SVG + PDF',c('Downloadable figures','可下载图表')]].map(([v,l])=>'<div class="metric"><strong>'+v+'</strong><span>'+l+'</span></div>').join('')+'</div><section id="cases"><div class="section-head"><h2>'+c('Resource use cases','资源使用案例')+'</h2></div><div class="example-grid">'+data.items.map(item=>'<article class="card"><p class="eyebrow">'+e(item.gene)+' · GSE133684</p><h2>'+e(c(item.title_en,item.title_zh))+'</h2><p>'+e(c(item.summary_en,item.summary_zh))+'</p><a href="examples/'+item.id+'/figure.svg"><img class="example-figure" src="examples/'+item.id+'/figure.svg" alt="'+e(c(item.title_en,item.title_zh))+'"></a><div class="metadata-downloads">'+['values.tsv','data.json','reproduce.py','figure.svg','figure.pdf','reproduction.zip'].map(name=>'<a class="btn small" download href="examples/'+item.id+'/'+name+'">'+name+'</a>').join('')+'</div><p class="small muted">'+e(c(item.caption_en,item.caption_zh))+'</p>'+(item.gene==='KRAS'?'<div class="note warning">'+c('Only 4 of 401 source labels have both measurements. The displayed correlation has very limited interpretation and is not validation.','401个来源标签中仅4个同时具有两项有效测量。相关系数的解释受到很大限制，不作为验证依据。')+'</div>':'')+'</article>').join('')+'</div></section><section class="card section-gap" id="methods"><h2>'+c('Methods, access and interpretation','方法、访问范围与解释')+'</h2><p>'+c('Genes were specified before examining group effects. The first two lexical source promoter IDs are shown for EPCAM; they are not outcome-selected or asserted major promoters. Values are joined by exact source observation IDs. Missing values remain NA; observed zero values remain zero. Boxplot whiskers show observed ranges.','示例基因在检查组间效应前指定。EPCAM展示按来源ID字典顺序排列的前两个启动子，不按效应筛选，也不声明为主要启动子。数值按精确来源观察ID配对，保留NA与实测零值；箱线图须线表示实测范围。')+'</p><p>'+c('Source labels are not confirmed independent patients or libraries. Shared reads, preparation protocol and batch can influence these descriptive patterns. No diagnostic accuracy, independent molecular validation or clinical utility is claimed.','来源标签不等于已确认的独立患者或文库。共享reads、建库流程和批次均可能影响这些描述性分布；案例不声明诊断性能、独立分子验证或临床效用。')+'</p><p>'+c('The planned interactive open projection contains four GSE133684 views: mRNA/lncRNA expression, RNA coverage, promoter activity and promoter gene usage. HRA000210 is limited to a study-level directory; no HRA per-label measurements or clinical records are published. ASE redistribution remains pending review of third-party annotation terms.','交互式公开投影包含GSE133684的四个视图：mRNA/lncRNA表达、RNA覆盖谱、启动子活性和基因层启动子使用率。HRA000210仅限研究级目录，未公开逐标签测量或临床记录。ASE再分发仍待核对第三方注释条款。')+'</p><p>'+c('Full historical QC reconstruction for HRA AS, editing, Mutation and fusion remains incomplete because original run model/report/selection files are inaccessible. Technical data integrity is distinct from biological validation.','HRA的AS、editing、Mutation及fusion原始运行模型、报告和筛选文件仍不可读，完整历史QC重建尚未完成。技术数据完整性与生物学验证是不同证据层级。')+'</p><p>'+c('Each ZIP includes the bound data, long values table, plotting script, pinned dependency, summaries, SHA-256 checksums and SVG/PDF/PNG figures. Run python reproduce.py --data data.json --output reproduced after installing requirements.txt. Cite the original source study and the release.','每个ZIP包含绑定数据、长表数值、绘图脚本、固定依赖、摘要、SHA-256清单及SVG/PDF/PNG图。安装requirements.txt后，运行python reproduce.py --data data.json --output reproduced。使用时引用原始来源研究及本版本。')+'</p><p><a href="https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE133684">GSE133684</a> · <a href="https://doi.org/10.1136/gutjnl-2019-318860">Source publication</a> · <a href="https://doi.org/10.1093/nar/gkad777">cfOmics</a> · <a href="https://doi.org/10.1093/nar/gkaf1004">exoRBase 3.0</a> · <a href="https://doi.org/10.1093/nar/gkab668">EVAtlas</a></p></section>';
